<!DOCTYPE html>
<html>
<head>
    <title>Login - HELFER CRM</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body style="margin:0; font-family: Arial; background: linear-gradient(135deg,#1e3c72,#2a5298);">

<div style="
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
">

    <!-- LOGO -->
    <img src="{{ url_for('static', filename='logo.png') }}" style="width:120px; margin-bottom:15px;">

    <h2>Login</h2>

    {% if erro %}
        <div style="color:red; margin-bottom:10px;">{{ erro }}</div>
    {% endif %}

    <!-- SELETOR -->
    <div style="margin-bottom:15px;">
        <select id="tipo_login" onchange="trocarLogin()" style="padding:8px; width:100%;">
            <option value="admin">Sou Empresa (Admin)</option>
            <option value="funcionario">Sou Funcionário</option>
        </select>
    </div>

    <form method="POST">

        <input type="hidden" name="tipo_login" id="tipo_login_hidden" value="admin">

        <!-- EMAIL -->
        <div id="campo_email">
            <input type="email" name="email" placeholder="Email"
            style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
        </div>

        <!-- NOME -->
        <div id="campo_nome" style="display:none;">
            <input type="text" name="nome" placeholder="Nome do funcionário"
            style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
        </div>

        <input type="password" name="senha" placeholder="Senha" required
        style="width:100%; padding:10px; margin-bottom:20px; border-radius:5px; border:1px solid #ccc;">

        <button type="submit"
        style="width:100%; background:#3b82f6; color:white; padding:12px; border:none; border-radius:6px;">
            Entrar
        </button>

    </form>

    <br>

    <a href="/registro" style="color:#3b82f6;">Criar conta</a>

</div>

<script>
function trocarLogin() {
    let tipo = document.getElementById("tipo_login").value;

    document.getElementById("tipo_login_hidden").value = tipo;

    if (tipo === "admin") {
        document.getElementById("campo_email").style.display = "block";
        document.getElementById("campo_nome").style.display = "none";
    } else {
        document.getElementById("campo_email").style.display = "none";
        document.getElementById("campo_nome").style.display = "block";
    }
}
</script>

</body>
</html>
